project_id = "eventor"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = [
  "http://localhost:3001",
  "http://localhost:3002",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.sms]
# Clients sign in with mobile + OTP. Signup stays off: a client row must already
# exist (created by the studio in admin) before the number can be used.
enable_signup = false
enable_confirmations = false
max_frequency = "5s"

# Local testing: fixed codes for these numbers, no SMS sent and the hook is not
# called. Remove before production — a fixed code is a permanent login bypass.
# [auth.sms.test_otp]
# 94771234567 = "123456"

[functions.send-sms-hook]
# Supabase Auth calls hooks without a user JWT, so verification must be off or
# every hook invocation returns 401. The request is authenticated instead by the
# standardwebhooks signature checked inside the function.
verify_jwt = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
port = 54327
backend = "postgres"
