# Netlify site: marketing landing page (Next.js)
# Set this site's Base directory to `apps/landing` in Netlify.

[build]
  command = "pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Inlined into the client bundle at build time. Set here rather than in the
  # Netlify UI so the deployed "Sign up" / "Sign in" links can never fall back
  # to a localhost URL. (netlify.toml values override UI values.)
  NEXT_PUBLIC_ADMIN_URL = "https://app.eventorcrm.com"
  NEXT_PUBLIC_PORTAL_URL = "https://portal.eventorcrm.com"
